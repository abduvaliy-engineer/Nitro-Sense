name: Checks

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax
        run: |
          for file in $(git ls-files 'app/*.js' ':!app/vendor'); do node --check "$file"; done
          bash -n install.sh data/nitrosense-setup data/nitrosense-artwork
          python3 -m py_compile tools/*.py data/nitrosense-modekey
      - name: udev rules
        run: udevadm verify --resolve-names=never data/70-nitrosense.rules
      - name: Build libraries (WebKitGTK, GTK 3)
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        run: cargo build --locked
      - name: Backend tests (lighting encoder, App Sync matching, Live Update's .deb and .rpm choice)
        run: cargo test --locked
      - name: Scenario mode on plugging in and unplugging
        run: node tests/scenario-power.js app
      - name: Mode Switch Key service
        run: python3 -I -B tests/mode-key.py data/nitrosense-modekey
      - name: NitroSense key binding
        run: |
          command -v gsettings >/dev/null || sudo apt-get install -y libglib2.0-bin
          bash tests/key-binding.sh data/nitrosense-setup
      - name: Driver rebuild rule
        run: bash tests/driver-outdated.sh install.sh
      - name: Version stays 0.x
        # 1.0.0 is reserved for the complete one-to-one NitroSense; until then the minor keeps counting (0.10, 0.11, ...).
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          case "$version" in
            0.*) ;;
            *) echo "::error::$version: NitroSense for Linux stays 0.x until it matches NitroSense one to one"; exit 1 ;;
          esac
      - name: New version for a release
        if: github.base_ref == 'main'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version in Cargo.toml"
            exit 1
          fi

  rust-1-85:
    # install.sh builds with the distribution's cargo, and Debian 13's is Rust 1.85 (rust-version in Cargo.toml): a
    # dependency that needs a newer Rust would break installs and Live Updates there.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Rust and the build libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git cargo build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

