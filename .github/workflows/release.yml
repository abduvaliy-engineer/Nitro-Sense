name: Release

# Every merge into main publishes the version in Cargo.toml as a GitHub release. Live Update finds it there and
# installs its tag archive with install.sh. A manual run on main (gh workflow run release.yml --ref main) publishes
# a release whose creation failed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "NitroSense $version" --generate-notes
